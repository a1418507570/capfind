[workspace]
resolver = "2"
members = [
    "crates/capfind-core",
    "crates/capfind-parsers",
    "crates/capfind-search",
    "crates/capfind-cli",
    "xtask",
]
# The standalone capfind-mcp crate is kept out of default members so `cargo build` stays lean.
exclude = ["crates/capfind-mcp"]

[workspace.package]
version      = "0.3.1"
edition      = "2021"
rust-version = "1.80"
authors      = ["capfind contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/a1418507570/capfind"
homepage     = "https://github.com/a1418507570/capfind"
description  = "Find reusable capabilities in big polyglot repos — zero-LLM, deterministic, AI-agent friendly."

[workspace.dependencies]
# ─── data ─────────────────────────────────────────────────────────
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
bincode            = "1.3"
zstd               = { version = "0.13", default-features = false }
zip                = "0.6"
ahash              = "0.8"
blake3             = "1"

# ─── parsing ──────────────────────────────────────────────────────
regex              = "1.10"
aho-corasick       = "1.1"
once_cell          = "1"

# ─── traversal & perf ─────────────────────────────────────────────
ignore             = "0.4"
globset            = "0.4"
rayon              = "1.10"
memmap2            = "0.9"
crossbeam-channel  = "0.5"

# ─── cli ──────────────────────────────────────────────────────────
clap               = { version = "4", features = ["derive", "cargo"] }
clap_complete      = "4"
owo-colors         = "4"
is-terminal        = "0.4"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── testing ──────────────────────────────────────────────────────
insta              = { version = "1", features = ["yaml"] }
assert_cmd         = "2"
predicates         = "3"
tempfile           = "3"
pretty_assertions  = "1"

# ─── local ────────────────────────────────────────────────────────
capfind-core       = { path = "crates/capfind-core",    version = "0.3.1" }
capfind-parsers    = { path = "crates/capfind-parsers", version = "0.3.1" }
capfind-search     = { path = "crates/capfind-search",  version = "0.3.1" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
opt-level     = 3

[profile.dev]
# keep compile feedback loop fast; release is what users get
opt-level = 0
debug     = 1
